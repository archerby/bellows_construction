<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bellows calculator</title>
  <meta name="description" content="Bellows and large-format camera designer: geometry, drawing, pattern, 3D model and printable STL parts">
  <link rel="stylesheet" href="css/style.css">
  <style id="page-style"></style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true">
        <path d="M2 6 L8 2 L12 22 L18 2 L22 22 L28 2 L32 22 L38 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1 data-i18n="app.title">Bellows calculator</h1>
        <p data-i18n="app.tagline"></p>
      </div>
    </div>
    <div class="top-actions">
      <select id="lang" class="lang" aria-label="Language"></select>
      <button type="button" id="btn-save-json" class="ghost" data-i18n="btn.save"></button>
      <label class="ghost file-btn"><span data-i18n="btn.load"></span><input type="file" id="file-json" accept=".json,application/json" hidden></label>
      <button type="button" id="btn-reset" class="ghost" data-i18n="btn.reset"></button>
    </div>
  </header>

  <main class="layout">
    <aside class="params" id="params" data-i18n-aria="aria.params"></aside>

    <section class="workspace">
      <div class="summary" id="summary"></div>
      <div id="messages" class="messages" aria-live="polite"></div>

      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="drawing" class="active" data-i18n="tab.drawing"></button>
        <button role="tab" data-tab="pattern" data-i18n="tab.pattern"></button>
        <button role="tab" data-tab="view3d" data-i18n="tab.view3d"></button>
        <button role="tab" data-tab="stl" data-i18n="tab.stl"></button>
        <button role="tab" data-tab="camera" data-i18n="tab.camera"></button>
      </nav>

      <div class="tab-panel active" id="tab-drawing">
        <div class="toolbar">
          <button type="button" data-action="drawing-svg" data-i18n="btn.svg"></button>
          <span class="hint" data-i18n="hint.svgNav"></span>
        </div>
        <div class="svg-view" id="drawing-view"></div>
      </div>

      <div class="tab-panel" id="tab-pattern">
        <div class="toolbar">
          <label class="check"><input type="checkbox" id="pat-stiff" checked> <span data-i18n="cb.stiff"></span></label>
          <label class="check"><input type="checkbox" id="pat-labels" checked> <span data-i18n="cb.labels"></span></label>
          <span class="sep"></span>
          <button type="button" data-action="pattern-svg">SVG 1:1</button>
          <button type="button" data-action="pattern-dxf">DXF</button>
          <span class="sep"></span>
          <label><span data-i18n="lbl.printOn"></span>
            <select id="print-paper">
              <option value="A4">A4</option>
              <option value="A3">A3</option>
              <option value="A2">A2</option>
            </select>
          </label>
          <button type="button" data-action="pattern-print" data-i18n="btn.printTiles"></button>
          <span class="hint" id="print-hint"></span>
        </div>
        <div class="svg-view" id="pattern-view"></div>
      </div>

      <div class="tab-panel" id="tab-view3d">
        <div class="toolbar">
          <label class="range"><span data-i18n="lbl.ext"></span>
            <input type="range" id="ext-range" min="0" max="100" step="0.5">
            <output id="ext-out"></output>
          </label>
          <label class="check"><input type="checkbox" id="v-fabric" checked> <span data-i18n="cb.fabric"></span></label>
          <label class="check"><input type="checkbox" id="v-stiff" checked> <span data-i18n="cb.stiff"></span></label>
          <label class="check"><input type="checkbox" id="v-edges" checked> <span data-i18n="cb.edges"></span></label>
          <span class="sep"></span>
          <button type="button" data-action="mesh-stl" data-i18n="btn.meshStl"></button>
          <button type="button" data-action="view-png">PNG</button>
          <button type="button" data-action="view-reset" class="ghost" data-i18n="btn.viewReset"></button>
        </div>
        <div class="canvas-wrap">
          <canvas id="gl"></canvas>
          <div class="canvas-hint" data-i18n="hint.3dNav"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-stl">
        <div class="toolbar">
          <label><span data-i18n="lbl.mode"></span>
            <select id="stl-mode">
              <option value="bed" data-i18n="stl.mode.bed"></option>
              <option value="panels" data-i18n="stl.mode.panels"></option>
              <option value="pattern" data-i18n="stl.mode.pattern"></option>
            </select>
          </label>
          <label><span data-i18n="lbl.bed"></span> <input type="number" id="bed-w" value="220" min="50" step="1" class="short"> × <input type="number" id="bed-h" value="220" min="50" step="1" class="short"> <span data-i18n="u.mm"></span></label>
          <label><span data-i18n="lbl.gap"></span> <input type="number" id="bed-gap" value="2" min="0.5" step="0.5" class="short"> <span data-i18n="u.mm"></span></label>
          <label class="check" data-i18n-title="cb.diagTitle"><input type="checkbox" id="bed-diag" checked> <span data-i18n="cb.diag"></span></label>
          <span class="sep"></span>
          <button type="button" data-action="stl-export" class="primary" data-i18n="btn.stl"></button>
        </div>
        <div class="stl-info" id="stl-info"></div>
        <div class="svg-view" id="stl-view"></div>
      </div>

      <div class="tab-panel" id="tab-camera">
        <div class="cam-grid">
          <aside class="cam-params" id="cam-params" data-i18n-aria="aria.camParams">
            <p class="cam-intro" data-i18n="cam.intro"></p>
          </aside>
          <div class="cam-main">
            <div class="summary" id="cam-summary"></div>
            <div id="cam-messages" class="messages" aria-live="polite"></div>
            <div class="toolbar">
              <label class="range"><span data-i18n="lbl.camExt"></span>
                <input type="range" id="cam-ext" min="0" max="100" step="1">
                <output id="cam-ext-out"></output>
              </label>
              <label class="check" id="cv-folded-wrap" hidden><input type="checkbox" id="cv-folded"> <span data-i18n="cv.folded"></span></label>
              <label class="check"><input type="checkbox" id="cv-bellows" checked> <span data-i18n="cv.bellows"></span></label>
              <label class="check"><input type="checkbox" id="cv-lens" checked> <span data-i18n="cv.lens"></span></label>
              <label class="check"><input type="checkbox" id="cv-holder"> <span data-i18n="cv.holder"></span></label>
              <label class="check"><input type="checkbox" id="cv-fx"> <span data-i18n="cv.fx"></span></label>
              <label class="check" id="cv-rail-wrap"><input type="checkbox" id="cv-rail" checked> <span data-i18n="cv.rail"></span></label>
              <span class="sep"></span>
              <button type="button" data-action="cam-png">PNG</button>
              <button type="button" data-action="cam-view-reset" class="ghost" data-i18n="btn.viewReset"></button>
              <button type="button" data-action="cam-zip" class="primary" data-i18n="btn.zip"></button>
            </div>
            <div class="canvas-wrap cam-canvas">
              <canvas id="gl-cam"></canvas>
              <div class="canvas-hint" data-i18n="hint.3dNav"></div>
            </div>
            <p class="hint cam-back-hint" data-i18n="cam.backHint"></p>
            <h3 class="cam-h" data-i18n="cam.partsH"></h3>
            <div class="table-wrap"><table class="data" id="cam-parts"></table></div>
            <h3 class="cam-h" data-i18n="cam.hwH"></h3>
            <div class="table-wrap"><table class="data" id="cam-bom"></table></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="print-area" aria-hidden="true"></div>


  <script src="js/i18n.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/pl.js"></script>
  <script src="js/lang/be.js"></script>
  <script src="js/lang/uk.js"></script>
  <script src="js/lang/ru.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/viewer3d.js"></script>
  <script src="js/csg.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
